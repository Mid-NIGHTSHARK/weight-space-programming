[project]
name = "weight-space-gemini"
version = "0.1.0"
description = "Independent Reproduction and Experimental Framework for MinAtar Breakout Weight-Space Programming"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "minatar==1.0.15",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "-v --strict-markers"
